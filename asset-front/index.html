<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能资产管理助手</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-cube"></i>
                    <span>智能助手</span>
                </div>
            </div>
            
            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-name">管理员</div>
                <div class="user-status">在线</div>
            </div>
            
            <!-- <div class="token-status">
                <div class="token-item">
                    <span class="token-label">用户令牌</span>
                    <span class="token-value" id="userTokenDisplay">加载中...</span>
                </div>
                <div class="token-item">
                    <span class="token-label">客户端令牌</span>
                    <span class="token-value" id="clientTokenDisplay">加载中...</span>
                </div>
            </div> -->
            
            <div class="quick-actions">
                <h3>快速操作</h3>
                <button class="action-btn" onclick="sendSuggestion('查询所有未分配的资产')">
                    <i class="fas fa-search"></i>
                    <span>查询资产</span>
                </button>
                <button class="action-btn" onclick="sendSuggestion('分配资产权限')">
                    <i class="fas fa-key"></i>
                    <span>分配资产</span>
                </button>
                <button class="action-btn" onclick="sendSuggestion('添加新成员账号')">
                    <i class="fas fa-user-plus"></i>
                    <span>管理成员</span>
                </button>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 顶部栏 -->
            <div class="top-bar">
                <div class="top-bar-left">
                    <button class="sidebar-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">智能资产管理助手</h1>
                </div>
                <div class="top-bar-right">
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        <span>系统正常</span>
                    </div>
                </div>
            </div>

            <!-- 聊天容器 -->
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- 欢迎消息 -->
                    <div class="welcome-message">
                        <div class="welcome-icon">
                            <i class="fas fa-robot"></i>
                        </div>
                        <h2>你好！我是智能资产管理助手</h2>
                        <p>我可以帮助您进行资产查询、分配资产、成员管理等操作</p>
                    </div>
                </div>
            </div>

            <!-- 顶部新对话按钮 -->
            <div class="new-chat-container">
                <button class="new-chat-btn" onclick="startNewChat()">
                    <i class="fas fa-plus"></i>
                    <span>开启新对话</span>
                </button>
            </div>

            <!-- 输入区域 -->
            <div class="chat-input-container">
                <div class="input-group">
                    <div class="input-wrapper">
                        <div class="input-actions-left">
                            <button class="attachment-btn" title="添加附件">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <button class="voice-btn" title="语音输入">
                                <i class="fas fa-microphone"></i>
                            </button>
                        </div>
                        <textarea 
                            id="messageInput" 
                            class="message-input" 
                            placeholder="给 智能资产管理助手 发送消息"
                            rows="1"
                        ></textarea>
                    </div>
                    <button id="stopBtn" class="stop-btn" onclick="stopProcessing()" style="display: none;">
                        <i class="fas fa-stop"></i>
                    </button>
                    <button id="sendBtn" class="send-btn" onclick="sendMessage()">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
                <div class="input-hint">
                    <span class="char-count" id="charCount">0/2000</span>
                    <span>Ctrl+Shift+N 新对话 | 由 AI 生成，请谨慎甄别</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在处理您的请求...</div>
    </div>

    <!-- 提示消息容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
